# Example nginx config for vegacore.co
# - Serves the Vite build from /var/www/vegacore/dist
# - Proxies /api and /uploads to the Node backend on port 3001
# - SPA fallback so /admin/login works on refresh

server {
    listen 80;
    listen [::]:80;
    server_name vegacore.co www.vegacore.co;

    root /var/www/vegacore/dist;
    index index.html;

    # API + uploaded project images
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Static assets (long cache)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: let React Router handle /admin, /portfolio, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
